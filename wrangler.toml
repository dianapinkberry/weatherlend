name = "weatherlend"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# Cloudflare D1 (SQLite). Locally, wrangler keeps the database in .wrangler/state.
# Before the first remote deploy, run `npx wrangler d1 create weatherlend-db`
# and paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "weatherlend-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
